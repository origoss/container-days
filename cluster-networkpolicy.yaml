# ClusterNetworkPolicy (Calico v3.32+): enforced at the kube-admin tier (order 1000).
# Cluster admins control this — developers CANNOT override it with namespace-scoped policies.
apiVersion: policy.networking.k8s.io/v1alpha2
kind: ClusterNetworkPolicy
metadata:
  name: deny-db-egress
spec:
  tier: Admin
  priority: 100
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: postgres
      podSelector:
        matchLabels:
          app.kubernetes.io/name: postgres
  egress:
  - name: deny-all-ipv4-egress
    action: Deny
    to:
    - networks:
      - 0.0.0.0/0
